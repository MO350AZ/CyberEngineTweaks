
name: Build and Release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64]
        mode: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Update xmake repository
        run: xmake.exe repo --update

      - name: Configure dependencies
        run: xmake.exe config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

      - name: Build and package
        run: xmake.exe package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            package/**
            !package/**/*.pdb
          if-no-files-found: error

      - name: Upload PDB debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.mode }}-pdb
          path: package/**/*.pdb
          if-no-files-found: ignore

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = Get-ChildItem package -Recurse -File |
            Where-Object { $_.Extension -ne ".pdb" }

          if (-not $files) {
            throw "No packaged files found."
          }

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "$env:RUNNER_TEMP\windows-x64-release.zip" `
            -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/windows-x64-release.zip
          generate_release_notes: true
